<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="396" viewBox="0 0 1000 396" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<title>Each tightening and loosening revision by date</title>
<desc>Scatter chart of 32 AI-policy revisions from May 2025 to October 2026. Each red dot above the axis is one tightening revision and each blue dot below the axis is one loosening revision; dots stack when revisions are close in time. Hovering a dot shows the project and change.</desc>
<rect width="1000" height="396" fill="#fff"/>
<text x="28" y="34" font-size="20" font-weight="600" fill="#1f2328">Tightening and loosening revisions, by date</text>
<text x="28" y="56" font-size="12" fill="#656d76">Each dot is one revision: 20 tightening above the line, 12 loosening below it, across 29 sampled projects. Hover a dot for the project and change.</text>
<circle cx="36" cy="86" r="6.5" fill="#c0392b"/><text x="50" y="90" font-size="12" fill="#1f2328">Tightening <tspan fill="#656d76">20</tspan></text>
<circle cx="170" cy="86" r="6.5" fill="#2166ac"/><text x="184" y="90" font-size="12" fill="#1f2328">Loosening <tspan fill="#656d76">12</tspan></text>
