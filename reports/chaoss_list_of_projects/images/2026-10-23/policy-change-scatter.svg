<text x="28" y="334" font-size="11" fill="#656d76">Not shown: 20 revisions that neither tighten nor loosen (first recorded policies, mixed changes, wording-only clarifications).</text>
<text x="28" y="352" font-size="11" fill="#656d76">Direction was assigned by the report author from the linked diffs and is not independently validated.</text>
<text x="28" y="370" font-size="11" fill="#656d76">Projects were chosen for having revision histories, so this describes the sample, not all projects.</text>
