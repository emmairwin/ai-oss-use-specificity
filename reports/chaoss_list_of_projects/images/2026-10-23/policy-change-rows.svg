<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1206" viewBox="0 0 1600 1206" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<title>First test of the AI policy-change metric</title>
<desc>One row per project, with revision dates on a shared horizontal axis from May 2025 to October 2026. Within a row, dots above the row line indicate tightening, dots below indicate loosening, and dots on the line indicate a new policy baseline, mixed change, clarification, or no established direction. Distance is qualitative, not a measured score. The 52 dots correspond to source-linked change descriptions in the accompanying Markdown report; dots are not links.</desc>
<rect width="1600" height="1206" fill="#ffffff"/>
<text x="28" y="38" font-size="22" font-weight="600" fill="#1f2328">First test of the AI policy-change metric</text>
<text x="28" y="62" font-size="12" fill="#656d76">52 revisions: 47 substantive provisions (11 baselines + 36 revisions), 5 clarifications / operational changes / reorganizations · 29 projects</text>
<g font-size="11" fill="#424a53">
<text x="28" y="88">Each row is one project; each dot is one revision. Above the row line = tightening, below = loosening, on the line = baseline, mixed, or clarification.</text>
<text x="28" y="106">Rows with colored lines are projects with more than one revision; gray rows had a single revision. Hover a dot for its description; the full list with source links is below.</text>
</g>
