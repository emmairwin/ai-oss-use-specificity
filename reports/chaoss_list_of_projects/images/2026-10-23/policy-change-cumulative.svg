<text x="816" y="250" font-size="13" font-weight="700" fill="#2166ac">12  Loosening</text>
<text x="28" y="533" font-size="11" fill="#656d76">Each line adds up revisions of one kind, so it can only rise; steeper means more of that kind of change. The last window ends 21 Oct 2026.</text>
<text x="28" y="551" font-size="11" fill="#656d76">Not shown: 21 revisions that neither tighten nor loosen (first recorded policies, mixed changes, wording-only clarifications).</text>
<text x="28" y="569" font-size="11" fill="#656d76">Direction was assigned by the report author from the linked diffs and has not been independently validated. Projects were chosen for having revision histories, so this describes the sample, not all projects.</text>
