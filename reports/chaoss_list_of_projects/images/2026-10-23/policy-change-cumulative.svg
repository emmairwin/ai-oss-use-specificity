<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="585" viewBox="0 0 1000 585" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<title>AI policy changes go in both directions, with no clear trend and slightly more tightening</title>
<desc>Line chart of cumulative AI-policy revisions from May 2025 to October 2026 in 29 sampled projects. By the end: 19 tightening and 12 loosening revisions.</desc>
<rect width="1000" height="585" fill="#fff"/>
<text x="28" y="34" font-size="20" font-weight="600" fill="#1f2328">AI policy changes go in both directions, with no clear trend and slightly more tightening</text>
<text x="28" y="56" font-size="12" fill="#656d76">Cumulative tightening and loosening revisions across 29 sampled projects. 16 projects tightened, 10 loosened, 5 did both.</text>
