name: README style

on:
  pull_request:
    paths:
      - "**/README.md"
      - "README.md"
      - "reports/critical-dependencies/**"
      - "scripts/check_critical_dependency_sources.py"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed README prose
        run: python3 scripts/check_readme_style.py "${{ github.event.pull_request.base.sha }}"
      - name: Check critical-dependencies source inventory
        run: python3 scripts/check_critical_dependency_sources.py
