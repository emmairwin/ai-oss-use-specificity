<path d="M 70.71 144.06 A 175 175 0 0 1 199.78 75.30 L 210 250 Z" fill="#8250df" stroke="#ffffff" stroke-width="1.5"/>
<path d="M 199.78 75.30 A 175 175 0 0 1 204.89 75.07 L 210 250 Z" fill="#e16f24" stroke="#ffffff" stroke-width="1.5"/>
<path d="M 204.89 75.07 A 175 175 0 0 1 210.00 75.00 L 210 250 Z" fill="#54aeff" stroke="#ffffff" stroke-width="1.5"/>
</g>
