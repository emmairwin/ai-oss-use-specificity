<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<title>Policy mentions by domain</title>
<desc>A pie chart shows the distribution of 433 policy-covered domain entries across nine domains. Each entry combines reports marked addressed or partial. A report can contribute to multiple domains; blank and rationale-only entries are excluded.</desc>
<rect width="820" height="500" fill="#ffffff"/>
<text x="24" y="36" font-size="16" font-weight="600" fill="#1f2328">Policy mentions by domain</text>
<text x="24" y="58" font-size="11" fill="#656d76">Counts combine addressed (X) and partial (~); blank and rationale-only entries are excluded.</text>
<text x="24" y="76" font-size="11" fill="#656d76">Each slice is a domain mention, not a unique project; one report may count in multiple domains.</text>
<g transform="translate(0 24)">
