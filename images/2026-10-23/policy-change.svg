<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<title>First test of the AI policy-change metric</title>
<desc>One timeline from May 2025 to October 2026. Dot color identifies project. Dots above the central line indicate tightening, dots below indicate loosening, and dots on the line indicate a new policy baseline, mixed change, clarification, or no established direction. Distance from the line is qualitative, not a measured score. The 28 numbered markers correspond to source-linked change descriptions in the accompanying Markdown report; markers are not links.</desc>
